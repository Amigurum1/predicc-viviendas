# ============================================
# CONFIGURACIÓN DE PYTEST
# ============================================
# Sin este fichero, `pytest` ejecutado desde la raíz del proyecto no funcionaba:
# además de los tests, recolectaba cualquier fichero que casara con el glob por
# defecto de doctest (`test*.txt`), y los volcados de salida de pytest que había
# en la raíz estaban en UTF-16LE, así que la colección abortaba con
# "UnicodeDecodeError" y NO se ejecutaba ni un solo test.
#
# `testpaths` limita la búsqueda a tests/, así que la raíz puede tener scripts y
# artefactos sin romper la suite.

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Evita que pytest intente recolectar ficheros de datos como si fueran doctests
addopts = --strict-markers
